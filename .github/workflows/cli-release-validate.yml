name: cli-release-validate

# Required check for pull requests targeting `main`, including the Copilot CLI release sync
# pull request.
#
# These run on the pull request head (the merge ref), unlike the pre-flight lint/typecheck in
# cli-release-auto-pr.yml which runs on the scheduled run's SHA and therefore never appears as
# a check on the pull request.
#
# Caveat: a pull request created with secrets.GITHUB_TOKEN does trigger `pull_request`
# workflows, but GitHub holds those runs in `action_required` until someone with write access
# approves them (a security control for bot-authored pull requests; declaring read-only
# `permissions` does not bypass it). Configure CLI_RELEASE_APP_ID /
# CLI_RELEASE_APP_PRIVATE_KEY so the sync pull request is created with an App token and this
# workflow starts without manual approval. Otherwise approve the run from the Actions tab.
#
# Deliberately no `paths` filter: a workflow that is skipped by a path filter never reports a
# status, so designating it a required check would leave every unrelated pull request stuck on
# "Expected — Waiting for status to be reported". It therefore runs on every pull request and
# is cheap enough (~40s) to be a required check for all of them.

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: cli-release-validate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout pull request head
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck
